# docs/10_requirements_definition.yaml

project_overview:
  project_name: "MD-WBS-Tools"
  objective: |
    Excelで管理されているWBS情報を、Microsoft Copilotが解釈しやすい`simple-md-wbs`形式へ変換する。
    これにより、AIアシスタントによるプロジェクト状況の正確な把握と活用を支援する。
  scope: |
    - PowerShell + COM を用いた、Excelから`simple-md-wbs`への変換機能の開発。
    - `simple-md-wbs`とCSV形式の相互変換機能の開発。
    - 上記機能を実現するためのPowerShellスクリプト、モジュール、および関連ドキュメントの整備。
  target_date_of_this_document: "2025-06-29"

system_requirements:
  - "データ処理はローカル環境で完結すること。"
  - "PowerShell（バージョン 7.3 以上）を主要言語とする。"
  - "Excelの操作にはCOMインターフェースを使用する。"
  - "VS CodeとMarkmap拡張機能の利用を推奨する。"

functional_requirements:
  # =================================================================
  # フェーズ1: Excel → simple-md-wbs 変換（最優先）
  # =================================================================
  excel_to_simplemdwbs:
    id: "EXCEL-TO-SIMPLEMDWBS"
    name: "Excelからsimple-md-wbsへの変換"
    description: |
      指定されたExcelファイルのWBSシートからデータを読み込み、`simple-md-wbs`形式のMarkdownファイルを生成する。
      初期フェーズでは基本的な階層と属性の変換を実装し、将来的に数式やグループ化の解析を追加する。
    input_specifications:
      source_type: "Excel File"
      sheet_name: "wbs" # 変換対象のシート名
      header_row: 5 # ヘッダーが記載されている行番号
      data_start_row: 6 # データが開始される行番号
      columns: # 変換元となるExcelの列定義（列名と対応するsimple-md-wbs属性）
        - excel_column: "大分類"
          target_attribute: "CategoryH2"
        - excel_column: "中分類"
          target_attribute: "CategoryH3"
        - excel_column: "小分類"
          target_attribute: "CategoryH4"
        - excel_column: "タスクアイテム"
          target_attribute: "TaskItem"
        - excel_column: "ユーザー記述ID" # 例: TASK-001
          target_attribute: "ユーザー記述ID"
        - excel_column: "担当者名"
          target_attribute: "担当者"
        - excel_column: "開始入力"
          target_attribute: "開始日（入力）"
        - excel_column: "終了入力"
          target_attribute: "終了日（入力）"
        - excel_column: "日数入力"
          target_attribute: "日数（入力）"
        - excel_column: "進捗実績"
          target_attribute: "進捗率"
        # 将来のフェーズで対応する列
        # - excel_column: "関連番号"
        #   target_attribute: "関連タスクID"

  # =================================================================
  # フェーズ2: simple-md-wbs ⇔ CSV 相互変換
  # =================================================================
  simplemdwbs_to_csv:
    id: "SIMPLEMDWBS-TO-CSV"
    name: "simple-md-wbsからCSVへの変換"
    description: "`simple-md-wbs`ファイルを解析し、他のツールで利用しやすいCSV形式で出力する。"
    output_specifications:
      target_type: "CSV File"
      encoding: "UTF-8"
      columns:
        - name: "id"
          source: "ツール自動生成の階層ID"
        - name: "level"
          source: "階層レベル (H1=1, H2=2, etc.)"
        - name: "name"
          source: "カテゴリ名またはタスク名"
        - name: "user_id"
          source: "ユーザー記述ID"
        - name: "start_date"
          source: "開始日（入力）"
        - name: "end_date"
          source: "終了日（入力）"
        - name: "duration"
          source: "日数（入力）"
        - name: "assignee"
          source: "担当者"
        - name: "progress"
          source: "進捗率"
        - name: "predecessor_id"
          source: "先行タスクのuser_id"

  csv_to_simplemdwbs:
    id: "CSV-TO-SIMPLEMDWBS"
    name: "CSVからsimple-md-wbsへの変換"
    description: "指定されたフォーマットのCSVファイルを読み込み、`simple-md-wbs`形式のMarkdownファイルを生成する。"
    input_specifications:
      source_type: "CSV File"
      # CSVの列仕様は simplemdwbs_to_csv.output_specifications を参照

# =================================================================
# データ形式定義
# =================================================================
data_format_definitions:
  simple_md_wbs:
    description: "Markdownの見出しとリストで階層を表現し、属性をHTMLコメントに記述する形式。詳細は docs/12_wbs_task_syntax_specification.md を参照。"
    element_attributes: # simple-md-wbsで管理する属性のマスターリスト
      - "ユーザー記述ID"
      - "開始日（入力）"
      - "終了日（入力）"
      - "日数（入力）"
      - "関連タスク種別"
      - "関連タスクID"
      - "開始日（実績）"
      - "終了日（実績）"
      - "進捗率"
      - "担当者"
      - "担当組織"
      - "最終更新日"
      - "コメント"

non_functional_requirements:
  - "スクリプトは可読性が高く、保守しやすいこと。"
  - "エラーハンドリングが適切に行われ、堅牢であること。"
  - "ユーザーマニュアルが整備され、利用者が独力で操作できること。"

deliverables:
  - "PowerShellスクリプト:"
    - "`Convert-ExcelToSimpleMdWbs.ps1`"
    - "`Convert-SimpleMdWbsToCsv.ps1`"
    - "`Convert-CsvToSimpleMdWbs.ps1`"
  - "PowerShellモジュール: `MyCommonFunctions`"
  - "ドキュメント:"
    - "プロジェクトロードマップ"
    - "開発憲章"
    - "要件定義書（本ドキュメント）"
    - "`simple-md-wbs`仕様書"
    - "ユーザーマニュアル"
  - "テストコードおよびテストデータ"

